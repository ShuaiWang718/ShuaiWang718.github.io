# Site-wide configuration for Shuai Wang's academic homepage.
# Restart `jekyll serve` after changing this file.

# Site Settings
title                    : "Shuai Wang"
description              : "Ph.D. student at UESTC. My research focuses on brain-inspired computing, spiking neural networks, efficient multimodal models, event-based tracking, and model compression."
repository               : "Buwwy123/WangShuai.github.io"
google_scholar_stats_use_cdn : true

# Google Analytics (optional)
google_analytics_id      :

# SEO verification (optional; add values after registering the site)
google_site_verification :
bing_site_verification   :
baidu_site_verification  :

# Site Author
author:
  name             : "Shuai Wang"
  avatar           : "images/me.jpg"
  bio              : "Ph.D. Student, UESTC"
  location         : "Chengdu, Sichuan, China"
  employer         : "University of Electronic Science and Technology of China"
  pubmed           :
  googlescholar    : "https://scholar.google.com/citations?user=89j9Uu4AAAAJ"
  email            : "wangshuai718@std.uestc.edu.cn"
  researchgate     :
  uri              :
  bitbucket        :
  codepen          :
  dribbble         :
  flickr           :
  facebook         :
  foursquare       :
  github           : "buwwy123"
  google_plus      :
  keybase          :
  instagram        :
  impactstory      :
  lastfm           :
  linkedin         :
  # TODO: Add Shuai Wang's own DBLP profile URL. Do not use another author's ID.
  dblp             :
  # TODO: Add Shuai Wang's own ORCID URL after registration/confirmation.
  orcid            :
  pinterest        :
  soundcloud       :
  stackoverflow    :
  steam            :
  tumblr           :
  twitter          :
  vine             :
  weibo            :
  xing             :
  youtube          :
  wikipedia        :

# Reading Files
include:
  - .htaccess
  - _pages
  - files

exclude:
  - docs
  - google_scholar_crawler
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .github
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Asia/Shanghai

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
